[package]
name = "pi-carry-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pi-carry-core = { path = "../core" }
pi-carry-protocol = { path = "../protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
chrono = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
