[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/core",
    "crates/cli",
    "crates/fake-pi",
    "crates/e2e-client",
    "crates/desktop",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
if-addrs = "0.13"
iroh = { version = "=1.3.0", path = "vendor/iroh" }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1.1"
uuid = { version = "1", features = ["v4"] }

[patch.crates-io]
iroh-relay = { path = "vendor/iroh-relay" }
iroh = { path = "vendor/iroh" }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
